paths:
  originals: "inputs/_originals"
  cleaned: "work/cleaned"
  to_process: "work/to_process"
  work: "work"
  wiki: "wiki"
  tmp: "work/tmp"

options:
  allow_heading_heuristics: true
  fallback_to_heuristics_for_pdf: true
  ocr:
    enabled: true
    include_images: true
  cutoff_similarity: 0.5
  discard_sections:
    portada: true
    indice: true
    contraportada: true

menu:
  depth_limit: 3
  default_visible: true
  fallback_section: "99. Documentos no indexados"

headings:
  styles:
    "#": 1
    "##": 2
    "###": 3
    "####": 4
    "#####": 5
    "######": 6
